<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Calculator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* Calculator Box */
.calc {
    background: #fff;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 300px;
}

/* Display */
#display {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 10px;
    font-size: 24px;
    text-align: right;
    padding: 10px;
    margin-bottom: 15px;
    background: #fff0f5;
    color: #d81b60;
}

/* Buttons */
.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button {
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    background: #fce4ec;
    color: #c2185b;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
    background: #f8bbd0;
}

.operator {
    background: #f06292;
    color: white;
}

.equal {
    background: #ff4081;
    color: white;
    grid-column: span 2;
}

/* Glow animation */
.glow {
    animation: glow 0.8s;
}

@keyframes glow {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); color: #ff1744; }
    100% { transform: scale(1); }
}

/* Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 2s linear forwards;
}

@keyframes float {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-400px) scale(2);
        opacity: 0;
    }
}

/* Footer */
.footer {
    margin-top: 20px;
    font-weight: bold;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="calc">
    <input type="text" id="display" disabled placeholder="0">

    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="add('/')" class="operator">/</button>
        <button onclick="add('*')" class="operator">×</button>
        <button onclick="del()">DEL</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')" class="operator">-</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')" class="operator">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="add('0')" style="grid-column: span 2;">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<div class="footer">Love from AMIT bro ❤️</div>

<script>
const display = document.getElementById("display");

function add(val){
    display.value += val;
}

function clearDisplay(){
    display.value = "";
}

function del(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    let exp = display.value;

    if(exp === "1+4+3"){
        display.value = "Anshika ❤️ Santosh";
        display.classList.add("glow");
        blastHearts();
    } else {
        try{
            display.value = eval(exp);
            display.classList.add("glow");
        } catch {
            display.value = "Error";
        }
    }

    setTimeout(()=>display.classList.remove("glow"),800);
}

/* HEART BLAST */
function blastHearts(){
    for(let i=0;i<40;i++){
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left = Math.random()*100 + "vw";
        heart.style.top = "70vh";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),2000);
    }
}
</script>

</body>
</html>
