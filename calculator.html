<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<title>Romantic Calculator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* Calculator */
.calc {
    background: #fff;
    padding: 20px;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 300px;
    z-index: 10;
}

/* Display */
#display {
    width: 100%;
    height: 65px;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    text-align: right;
    padding: 10px;
    background: #fff0f5;
    color: #d81b60;
}

/* Buttons */
.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button {
    height: 50px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    background: #fce4ec;
    color: #c2185b;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
}

.operator { background: #f06292; color: white; }
.equal { background: #ff4081; color: white; grid-column: span 2; }

/* FULL SCREEN LOVE TEXT */
.full-love {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    font-family: 'Great Vibes', cursive;
    font-size: 65px;
    color: #ff1744;
    text-align: center;
    opacity: 0;
    z-index: 1000;
    animation: zoomIn 2s forwards;
}

/* Zoom Animation */
@keyframes zoomIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* Heart Beat */
.beat {
    display: inline-block;
    animation: beat 1s infinite;
}
@keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.4); }
}

/* HEART RAIN */
.rain-heart {
    position: absolute;
    top: -10px;
    font-size: 20px;
    animation: fall linear infinite;
}
@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

/* HEART BLAST */
.blast {
    position: absolute;
    font-size: 22px;
    animation: blastAnim 1.5s forwards;
}
@keyframes blastAnim {
    0% { opacity: 1; }
    100% { transform: translateY(-300px) scale(2); opacity: 0; }
}

/* Footer */
.footer {
    margin-top: 20px;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="calc">
    <input type="text" id="display" disabled placeholder="0">

    <div class="buttons">
        <button onclick="clr()">C</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">×</button>
        <button onclick="del()">DEL</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">-</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="add('0')" style="grid-column: span 2;">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<div class="footer">Love from AMIT bro ❤️</div>

<script>
let display = document.getElementById("display");

function add(v){ display.value += v; }
function clr(){ display.value = ""; }
function del(){ display.value = display.value.slice(0,-1); }

/* MAIN */
function calculate(){
    let exp = display.value;

    if(exp === "1+4+3"){
        display.value = "";

        showLoveMessage();
        heartBlast();
        heartRain();

    } else {
        try{
            display.value = eval(exp);
        }catch{
            display.value = "Error";
        }
    }
}

/* BIG LOVE TEXT */
function showLoveMessage(){
    let love = document.createElement("div");
    love.className = "full-love";

    love.innerHTML = `
        Anshika <span class="beat">❤️</span> Santosh
    `;

    document.body.appendChild(love);
}

/* HEART BLAST */
function heartBlast(){
    for(let i=0;i<30;i++){
        let h = document.createElement("div");
        h.className = "blast";
        h.innerHTML = "❤️";
        h.style.left = Math.random()*100 + "vw";
        h.style.top = "60vh";
        document.body.appendChild(h);

        setTimeout(()=>h.remove(),1500);
    }
}

/* HEART RAIN */
function heartRain(){
    setInterval(()=>{
        let h = document.createElement("div");
        h.className = "rain-heart";
        h.innerHTML = "💖";
        h.style.left = Math.random()*100 + "vw";
        h.style.animationDuration = (3 + Math.random()*3) + "s";
        document.body.appendChild(h);

        setTimeout(()=>h.remove(),6000);
    },120);
}
</script>

</body>
</html>
