<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<title>Romantic Calculator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* Calculator */
.calc {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 0 30px rgba(255, 0, 100, 0.3);
}

/* DISPLAY BOX */
#displayBox {
    width: 100%;
    height: 65px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    overflow: hidden;
    padding: 0 10px;
    position: relative;
}

/* NORMAL TEXT */
#displayText {
    font-size: 22px;
    color: #ff4d88;
    margin-left: auto;
}

/* LOVE SCROLL */
.love-scroll {
    position: absolute;
    white-space: nowrap;
    font-family: 'Great Vibes', cursive;
    font-size: 34px;
    font-weight: bold;
    color: #ff2e63;
    text-shadow: 0 0 10px #ff2e63;
    animation: scrollText 10s linear infinite;
}

/* SCROLL ANIMATION */
@keyframes scrollText {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

/* Buttons */
.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin-top: 15px;
}

button {
    height: 50px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    color: #ff4d88;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px #ff4d88;
}

.operator { background: #ff2e63; color: white; }
.equal { background: #ff0055; color: white; grid-column: span 2; }

/* HEART RAIN */
.rain-heart {
    position: absolute;
    top: -10px;
    font-size: 20px;
    color: #ff4d88;
    animation: fall linear infinite;
}
@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

/* HEART BLAST */
.blast {
    position: absolute;
    font-size: 25px;
    animation: blast 1.5s forwards;
}
@keyframes blast {
    0% { opacity: 1; }
    100% { transform: translateY(-300px) scale(2); opacity: 0; }
}

/* Footer */
.footer {
    margin-top: 20px;
    color: #ff4d88;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="calc">

    <div id="displayBox">
        <span id="displayText">0</span>
    </div>

    <div class="buttons">
        <button onclick="clr()">C</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">×</button>
        <button onclick="del()">DEL</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">-</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="add('0')" style="grid-column: span 2;">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<div class="footer">Love from AMIT bro ❤️</div>

<script>
let displayText = document.getElementById("displayText");

/* INPUT */
function add(v){
    displayText.classList.remove("love-scroll");
    displayText.style.position = "static";
    if(displayText.innerText === "0") displayText.innerText = "";
    displayText.innerText += v;
}

function clr(){
    displayText.innerText = "";
}

function del(){
    displayText.innerText = displayText.innerText.slice(0,-1);
}

/* CALCULATE */
function calculate(){
    let exp = displayText.innerText;

    if(exp === "1+4+3"){
        showScrollingLove();
        heartBlast();
        heartRain();
    } else {
        try{
            displayText.classList.remove("love-scroll");
            displayText.style.position = "static";
            displayText.innerText = eval(exp);
        }catch{
            displayText.innerText = "Error";
        }
    }
}

/* SCROLLING LOVE TEXT */
function showScrollingLove(){
    displayText.innerText = "Anshika ❤️ Santosh";
    displayText.classList.add("love-scroll");
}

/* HEART BLAST */
function heartBlast(){
    for(let i=0;i<25;i++){
        let h = document.createElement("div");
        h.className = "blast";
        h.innerHTML = "❤️";
        h.style.left = Math.random()*100 + "vw";
        h.style.top = "60vh";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),1500);
    }
}

/* HEART RAIN */
function heartRain(){
    setInterval(()=>{
        let h = document.createElement("div");
        h.className = "rain-heart";
        h.innerHTML = "💖";
        h.style.left = Math.random()*100 + "vw";
        h.style.animationDuration = (3 + Math.random()*3) + "s";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    },200);
}
</script>

</body>
</html>
