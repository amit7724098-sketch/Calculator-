<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Calculator</title>

<!-- Romantic Font -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* Calculator */
.calc {
    background: white;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 300px;
    z-index: 10;
}

#display {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    text-align: right;
    padding: 10px;
    background: #fff0f5;
    color: #d81b60;
}

/* Buttons */
.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button {
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    background: #fce4ec;
    color: #c2185b;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
    background: #f8bbd0;
}

.operator { background: #f06292; color: white; }
.equal { background: #ff4081; color: white; grid-column: span 2; }

/* Romantic Name Style */
.romantic-text {
    font-family: 'Great Vibes', cursive;
    font-size: 26px;
    text-align: center;
    color: #ff1744;
}

/* Floating Hearts Background */
.bg-heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 18px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(1); opacity: 1; }
    100% { transform: translateY(-10vh) scale(2); opacity: 0; }
}

/* Blast Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: blast 2s linear forwards;
}

@keyframes blast {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-400px); opacity: 0; }
}

.footer {
    margin-top: 20px;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="calc">
    <input type="text" id="display" disabled placeholder="0">

    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">×</button>
        <button onclick="del()">DEL</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">-</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="add('0')" style="grid-column: span 2;">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<div class="footer">Love from AMIT bro ❤️</div>

<script>
const display = document.getElementById("display");

/* Input */
function add(val){ display.value += val; }
function clearDisplay(){ display.value = ""; }
function del(){ display.value = display.value.slice(0,-1); }

/* Typing Animation */
function typeText(text){
    display.value = "";
    display.classList.add("romantic-text");

    let i = 0;
    let interval = setInterval(()=>{
        display.value += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 80);
}

/* Main Calculate */
function calculate(){
    let exp = display.value;

    if(exp === "1+4+3"){
        typeText("Anshika ❤️ Santosh");
        blastHearts();
        startBackgroundHearts();
    } else {
        try{
            display.classList.remove("romantic-text");
            display.value = eval(exp);
        } catch {
            display.value = "Error";
        }
    }
}

/* Blast hearts */
function blastHearts(){
    for(let i=0;i<30;i++){
        let h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "❤️";
        h.style.left = Math.random()*100 + "vw";
        h.style.top = "70vh";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),2000);
    }
}

/* Continuous hearts */
function startBackgroundHearts(){
    for(let i=0;i<20;i++){
        setInterval(()=>{
            let h = document.createElement("div");
            h.className = "bg-heart";
            h.innerHTML = "💖";
            h.style.left = Math.random()*100 + "vw";
            h.style.animationDuration = (3 + Math.random()*3) + "s";
            document.body.appendChild(h);
            setTimeout(()=>h.remove(),6000);
        },300);
    }
}
</script>

</body>
</html>
