<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Calculator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.calc-container {
    background: white;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    width: 300px;
}

#display {
    width: 100%;
    height: 60px;
    font-size: 24px;
    text-align: right;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #fff0f5;
    color: #d81b60;
    margin-bottom: 15px;
    transition: 0.3s;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button {
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    background: #fce4ec;
    color: #c2185b;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
    background: #f8bbd0;
}

.operator {
    background: #f06292;
    color: white;
}

.equal {
    background: #ff4081;
    color: white;
    grid-column: span 2;
}

/* HEART ANIMATION */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 2s linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-300px) scale(2); opacity: 0; }
}

/* RESULT EFFECT */
.glow {
    animation: glowEffect 0.8s ease-in-out;
}

@keyframes glowEffect {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); color: #ff1744; }
    100% { transform: scale(1); }
}

.footer {
    margin-top: 20px;
    font-weight: bold;
    color: #880e4f;
}
</style>
</head>

<body>

<div class="calc-container">
    <input type="text" id="display" disabled placeholder="0">

    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="append('/') " class="operator">/</button>
        <button onclick="append('*')" class="operator">×</button>
        <button onclick="del()">DEL</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('-')" class="operator">-</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('+')" class="operator">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="append('0')" style="grid-column: span 2;">0</button>
        <button onclick="append('.')">.</button>
    </div>
</div>

<div class="footer">Made by Amit 💖</div>

<script>
const display = document.getElementById('display');

function append(val){
    display.value += val;
}

function clearDisplay(){
    display.value = '';
}

function del(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    let exp = display.value;

    if(exp === "1+4+3"){
        display.value = "Anshika ❤️ Santosh";
        display.classList.add("glow");
        heartsExplosion();
    } else {
        try{
            display.value = eval(exp);
            display.classList.add("glow");
        }catch{
            display.value = "Error";
        }
    }

    setTimeout(()=>display.classList.remove("glow"),800);
}

/* HEART EFFECT FUNCTION */
function heartsExplosion(){
    for(let i=0;i<25;i++){
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left = Math.random()*100 + "vw";
        heart.style.top = "60vh";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),2000);
    }
}
</script>

</body>
</html>
